data:
    name: megadepth
    preprocessing:
        resize: 1024 #1024
        side: long
        square_pad: True
    train_split: train_scenes_clean.txt
    train_num_per_scene: 300
    val_split: valid_scenes_clean.txt
    val_pairs: valid_pairs.txt
    min_overlap: 0.1
    max_overlap: 0.7
    num_overlap_bins: 3
    read_depth: true
    read_image: true
    batch_size: 8
    num_workers: 4  # Set to 0 to avoid multiprocessing deadlocks
    load_features:
        do: true  # enable this if you have cached predictions
        path: exports/megadepth-undist-depth-r1024_SP-k1024-nms3/{scene}.h5
        padding_length: 1024 #2048
        padding_fn: pad_local_features
model:
    name: two_view_pipeline
    # run_gt_in_forward: True
    extractor:
        name: extractors.superpoint
        max_num_keypoints: 1024
        force_num_keypoints: True
        detection_threshold: 0.0
        nms_radius: 3
        trainable: False
    matcher:
        name: matchers.diffglue
        filter_threshold: 0.1
        flash: false
        checkpointed: true
        n_layers: 9
        scale: 2
        epipolar: enabled
        epi_weight: 1.0
        matcher_loss_weight: 0.1
        # LoFTR pretrained weights - faster convergence by reusing LoFTR's learned features
        # Download with: python scripts/download_loftr_weights.py
        loftr_pretrained: outdoor_ds.ckpt  # Uses LoFTR outdoor weights for backbone + coarse matching
        freeze_loftr_backbone: false  # freeze ResNetFPN backbone (use true for fine-tuning)
        freeze_loftr_coarse: false    # freeze LoFTR transformer + coarse matching
    ground_truth:
        name: matchers.depth_matcher
        th_positive: 3
        th_negative: 5
        th_epi: 5
    diffuser:
        name: diffusers.diffuser
        steps: 4096
        learn_sigma: False
        sigma_small: False
        noise_schedule: "linear"
        use_kl: False
        predict_xstart: True
        rescale_timesteps: True
        rescale_learned_sigmas: True
        timestep_respacing: ""
        ddim_steps: 2
        schedule_sampler: "uniform"
        use_ddim: True
        clip_denoised: True
        diffuser_loss_weight: 1
        scale: 2
    # GGDM: Geometry-Guided Alternating Transformer-Diffusion Matching (Algorithm 1)
    # This implements geometry-guided iterative refinement between diffusion and LoFTR
    #
    # TRAINING MODES (Section 3.7 of method):
    #   1. Standard DSM (unrolled_training=false): Train score network only
    #   2. Unrolled GGDM (unrolled_training=true): End-to-end through K iterations
    #      - Adds L_match and L_pose losses on M_K
    #      - Model learns to use geometry feedback
    #
    # INFERENCE: Always uses full GGDM loop when num_refinement_iters > 1
    refinement:
        num_refinement_iters: 1        # K iterations (1 = no loop, >1 = GGDM)
        use_geometry_guidance: false   # Enable epipolar gradient injection in diffusion
        geometry_guidance_weight: 0.1  # λ(t) - weight for geometry gradient: s^guided = s - λ*g
        feedback_to_loftr: false       # Feed refined matches back to LoFTR: S_k ← TransformerHead(bias=B^k)
        feedback_scale: 0.5            # γ - scale for B^(k) = γ log(M̃_k + ε)
        geometry_error_type: "sampson" # "sampson" or "symmetric" for SampsonMap(E; C)
        min_matches_for_E: 8           # Minimum matches for Weighted8Point
        top_k_candidates: 500          # k for TopKCandidates(M, k)
        reliability_threshold: 0.1     # Threshold for IsReliable(E, M) check
        init_from_previous: true       # x_T ← InitFrom(M_{k-1}) vs random noise
        # Unrolled training options (Section 3.7)
        unrolled_training: false       # If true: backprop through K iters with L_match + L_pose
        unrolled_k: 2                  # Number of iterations to unroll during training (keep small!)
        unrolled_t: 4                  # Number of diffusion steps to unroll (keep small!)
        loss_match_weight: 1.0         # λ_match for L_match = -log M_K(i,j)
        loss_pose_weight: 0.1          # λ_pose for L_pose = angle(R, R_gt) + angle(t, t_gt)
        # Warmup: start with DSM, then switch to unrolled GGDM
        warmup_epochs: 0               # Number of epochs with standard DSM before unrolled (0 = no warmup)
        # Gradual unfreezing: unfreeze LoFTR backbone after warmup for e2e fine-tuning
        unfreeze_backbone_after_warmup: false
        backbone_lr_factor: 0.1        # Backbone LR = main_LR * factor (lower to prevent forgetting)
    allow_no_extract: True
train:
    seed: 0
    epochs: 40
    log_every_iter: 100
    eval_every_iter: 1000
    lr: 1e-4
    lr_schedule:
        start: 3
        type: exp
        on_epoch: true
        exp_div_10: 10
    dataset_callback_fn: sample_new_items
benchmarks:
    megadepth1500:
        data:
            preprocessing:
                side: long
                resize: 1600
        eval:
            estimator: opencv
            ransac_th: 0.5
    hpatches:
        eval:
            estimator: opencv
            ransac_th: 0.5
        model:
            extractor:
                max_num_keypoints: 1024

